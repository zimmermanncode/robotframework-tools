[build-system]
build-backend = 'hatchling.build'
requires = [
    'hatch-vcs~=0.5.0',
    "hatchling~=1.32.0",
    "setuptools-scm~=10.2.1",
]

[project]
name = 'robotframework-tools'
description = 'Python Tools for Robot Framework and Test Libraries'
dynamic = ['version']

authors = [{ name = 'Stefan Zimmermann', email = 'zimmermann.code@gmail.com' }]
urls = { Repository = 'https://github.com/zimmermanncode/robotframework-tools'}
license = 'GPL-3.0-or-later'
license-files = ['COPYING']

requires-python = '>=3.14.7'
dependencies = [
    "moretools @ git+https://github.com/purplezimmermann/moretools.git@29d5e6377dc13ea1cdb5fc7e5d8b8f3e85f63f40",
    "path~=17.1.1",
    "robotframework~=7.5.0",
    "six~=1.17.0",
]

[dependency-groups]
dev = [
    'ipython~=9.18.1',
    'mypy~=2.3.1',
    'pre-commit~=4.6.2',
    'pytest~=9.1.1',
    'pytest-cov~=7.1.0',
    'ruff~=0.16.3',
    'setuptools-scm~=10.2.1',
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
source = 'vcs'

[tool.hatch.build.hooks.vcs]
version-file = 'robottools/__version__.py'

[tool.hatch.build.targets.wheel]
# The import packages are not named like the distribution (robotframework_tools),
# so hatchling must be told what to put in the wheel; otherwise it ships no code.
only-include = ['robottools', 'robotshell', 'ToolsLibrary.py']

[tool.setuptools_scm]
version_file = 'robottools/__version__.py'
